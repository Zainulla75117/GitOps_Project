apiVersion: v1
kind: Service
metadata:
  name: {{ include "gitops-app.fullname" . }}-frontend
  labels:
    app: {{ include "gitops-app.name" . }}-frontend
    chart: {{ include "gitops-app.chart" . }}
    release: {{ .Release.Name }}
spec:
  type: {{ .Values.frontend.service.type }}
  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: {{ include "gitops-app.name" . }}-frontend
    release: {{ .Release.Name }}
